@if (message()) {
  <div class="message-popup-backdrop" (click)="onBackdropClick()" role="presentation">
    <div
      class="message-popup-dialog"
      [class.is-info]="resolvedVariant() === 'info'"
      [class.is-warn]="resolvedVariant() === 'warn'"
      [class.is-success]="resolvedVariant() === 'success'"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="'messagePopupTitle'"
      (click)="$event.stopPropagation()"
    >
      <header class="modal-header message-popup-header">
        <h2 id="messagePopupTitle" class="message-popup-title">{{ resolvedTitle() }}</h2>
        <button type="button" class="close-icon-btn" (click)="dismiss()" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"
            />
          </svg>
        </button>
      </header>
      <p class="message-popup-body">{{ message() }}</p>
      <div class="message-popup-actions">
        @if (isConfirm()) {
          <button type="button" class="btn-cancel" (click)="dismiss()">{{ cancelLabel() }}</button>
          <button type="button" class="btn-primary" (click)="confirm()">{{ confirmLabel() }}</button>
        } @else {
          <button type="button" class="btn-primary" (click)="dismiss()">OK</button>
        }
      </div>
    </div>
  </div>
}
