<div class="modal-backdrop" (click)="onBackdropClick()" role="presentation">
  <div
    class="modal-dialog is-wide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ungrantedCashTitle"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      <div class="heading-block">
        <h2 id="ungrantedCashTitle">Ungranted Cash Request</h2>
      </div>
      <button type="button" class="close-icon-btn" (click)="onClose()" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
      </button>
    </header>

    <div class="modal-body">
      <section class="table-panel">
        <header class="table-head">
          <h3>Cash Requests</h3>
          <div class="table-head-meta">
            <span class="total-pill">Total {{ total() | number: '1.2-2' }}</span>
            <span class="count-pill">{{ requests().length }}</span>
          </div>
        </header>

        <app-usg-data-table
          rowKey="id"
          [columns]="columns"
          [data]="tableRows()"
          [actions]="tableActions"
          [pageSizeOptions]="[5, 10, 25]"
          [defaultPageSize]="5"
          emptyTitle="No ungranted cash requests"
          emptyDescription="New requests stay here until the vault approves them."
          (action)="onTableAction($event)"
        />
      </section>
    </div>
  </div>
</div>

<app-message-popup [message]="feedbackMessage()" (closed)="feedbackMessage.set('')" />
